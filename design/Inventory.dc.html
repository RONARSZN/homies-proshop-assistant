<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, ui-sans-serif, system-ui, sans-serif; background: #EDE8DE; }
    a { color: #d9322b; } a:hover { color: #b3271f; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #EDE8DE; box-sizing: border-box; color: #101110; position: relative; overflow: hidden;">

  <div style="padding: 62px 20px 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -0.04em; margin: 0;">Inventory</h1>
      <span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: #7C776C;">101 in stock</span>
    </div>

    <div style="margin-top: 14px; background: #F7F4EE; border-radius: 999px; height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C776C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="font-size: 15px; color: #9A958A;">Search name, SKU, or size</span>
    </div>

    <div style="display: flex; gap: 7px; margin-top: 12px;">
      <div style="display: inline-flex; align-items: center; height: 36px; padding: 0 15px; border-radius: 999px; background: #101110; color: #F4EFE6; font-size: 13px; font-weight: 700;">In stock</div>
      <div style="display: inline-flex; align-items: center; height: 36px; padding: 0 15px; border-radius: 999px; background: rgba(16,17,16,0.06); color: #55524A; font-size: 13px; font-weight: 600;">Low</div>
      <div style="display: inline-flex; align-items: center; height: 36px; padding: 0 15px; border-radius: 999px; background: rgba(16,17,16,0.06); color: #55524A; font-size: 13px; font-weight: 600;">All 354</div>
    </div>
  </div>

  <div style="padding: 16px 20px 0; height: 528px; overflow: hidden;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: #E4DED1; border-radius: 14px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#55524A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="m6 9 6 6 6-6"/></svg>
          <div style="font-size: 14px; font-weight: 800; letter-spacing: -0.01em; flex: 1;">{{g.name}}</div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A5F;">{{g.count}} &middot; {{g.units}}u &middot; {{g.value}}</div>
        </div>

        <div style="background: #F7F4EE; border-radius: 16px; padding: 0 14px; margin-top: 6px;">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 11px; min-height: 56px; padding: 9px 0; border-bottom: 1px solid #E9E3D8;">
              <div style="position: relative; width: 40px; height: 40px; flex: none;">
                <sc-if value="{{r.hasPhoto}}" hint-placeholder-val="{{true}}">
                  <div style="width: 40px; height: 40px; border-radius: 10px; background: #E0D8C8; display: grid; place-items: center; overflow: hidden;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B8171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c2.5 3 3.6 6.4 3.6 10S14.5 19 12 22c-2.5-3-3.6-6.4-3.6-10S9.5 5 12 2Z"/><path d="M8.6 12h6.8"/></svg>
                  </div>
                </sc-if>
                <sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{true}}">
                  <div style="width: 40px; height: 40px; border-radius: 10px; border: 1px dashed #B9B2A3; display: grid; place-items: center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9A498" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </div>
                </sc-if>
                <span style="position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: {{r.dot}}; border: 2px solid #F7F4EE;"></span>
              </div>
              <div style="min-width: 0; flex: 1;">
                <div style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</div>
                <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; color: #7C776C; margin-top: 3px;">{{r.sku}} &middot; {{r.size}}</div>
              </div>
              <div style="text-align: right; flex: none;">
                <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 16px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">{{r.qty}}</div>
                <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; color: #7C776C; margin-top: 3px;">{{r.price}}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 1px solid #DCD5C7; border-radius: 14px; margin-top: 2px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C776C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="m9 6 6 6-6 6"/></svg>
      <div style="font-size: 14px; font-weight: 700; color: #55524A; flex: 1;">Out of stock</div>
      <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: #7C776C;">224 &middot; older catalog</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 26px; display: flex; align-items: center; gap: 10px; background: linear-gradient(to top, #EDE8DE 62%, rgba(237,232,222,0));">
    <div style="flex: 1; background: #F7F4EE; border-radius: 999px; padding: 7px; display: flex; align-items: center; gap: 4px; box-shadow: 0 6px 22px rgba(16,17,16,0.10);">
      <div style="width: 44px; height: 44px; display: grid; place-items: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7C776C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; background: #101110; color: #F4EFE6; border-radius: 999px; height: 44px; padding: 0 16px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        <span style="font-size: 13px; font-weight: 700;">Stock</span>
      </div>
      <div style="width: 44px; height: 44px; display: grid; place-items: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7C776C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
      </div>
    </div>
    <div style="width: 58px; height: 58px; border-radius: 999px; background: {{accent}}; display: grid; place-items: center; flex: none; box-shadow: 0 6px 22px rgba(217,50,43,0.32);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#d9322b","section":"Brand"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#d9322b',
      groups: [
        {
          name: 'Wakeboards', count: '31', units: '54', value: '₱1.42M',
          rows: [
            { name: '2026 DUP Sapparod Pro', sku: '26sap148', size: '148', qty: '4', price: '₱37,000', dot: '#4E9B72', photo: true },
            { name: '2026 DUP BPM Pro', sku: '26bpm154', size: '154', qty: '4', price: '₱33,300', dot: '#4E9B72', photo: true },
            { name: '2024 SAPPAROD PRO', sku: '24sap152', size: '152', qty: '3', price: '₱27,000', dot: '#4E9B72', photo: false },
            { name: '2026 DUP Sapparod Pro', sku: '26sap156', size: '156', qty: '1', price: '₱37,000', dot: '#C8961F', photo: false }
          ]
        },
        {
          name: 'Helmets', count: '18', units: '41', value: '₱168,000',
          rows: [
            { name: 'Triple 8 Halo Water Helmet White', sku: '18watwgm', size: 'M', qty: '6', price: '₱2,000', dot: '#4E9B72', photo: true },
            { name: 'Triple 8 Gotham Neon Tangerine', sku: '18gotntl', size: 'L', qty: '2', price: '₱2,000', dot: '#C8961F', photo: false }
          ]
        }
      ].map(g => ({ ...g, rows: g.rows.map(r => ({ ...r, hasPhoto: r.photo, noPhoto: !r.photo })) }))
    };
  }
}
</script>
</body>
</html>
